name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=autonova --cov-report=term-missing -q
      - name: Validate JSON contracts
        run: |
          python -m json.tool contracts/research-job.schema.json >/dev/null
          python -m json.tool contracts/research-callback.schema.json >/dev/null
